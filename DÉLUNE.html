<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DÉLUNE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --ink: #f2efe9;
    --muted: #8d8a85;
    --serif: "Cormorant Garamond", "Didot", "Bodoni MT", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); }
  body {
    color: var(--ink);
    font-family: var(--serif);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    text-align: center;
    padding: env(safe-area-inset-top, 0px) 24px calc(env(safe-area-inset-bottom, 0px) + 28px);
    -webkit-font-smoothing: antialiased;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3.2rem;
    max-width: 34rem;
  }
  h1 {
    margin: 0;
    font-weight: 300;
    font-size: clamp(2.2rem, 9vw, 4.6rem);
    letter-spacing: 0.55em;
    margin-right: -0.55em;
    animation: rise 2.4s ease-out both;
  }
  p {
    margin: 0;
    font-size: clamp(1rem, 3.6vw, 1.2rem);
    line-height: 1.8;
    font-weight: 300;
    color: var(--muted);
    animation: rise 2.4s ease-out 0.6s both;
  }
  a {
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid rgba(242, 239, 233, 0.35);
    padding-bottom: 1px;
    transition: border-color .3s;
  }
  a:hover, a:focus-visible { border-color: var(--ink); outline: none; }
  footer {
    font-size: 0.78rem;
    letter-spacing: 0.12em;
    color: #55534f;
  }
  @keyframes rise { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { h1, p { animation: none; } }
</style>
</head>
<body>
  <main>
    <h1>DÉLUNE</h1>
    <p>Our website is coming soon.<br>In the meantime, you can find us exclusively on Instagram at <a href="https://instagram.com/delunelabel" target="_blank" rel="noopener">@delunelabel</a>.</p>
  </main>
  <footer>© DÉLUNE Magazine. All rights reserved. 2026</footer>
</body>
</html>
